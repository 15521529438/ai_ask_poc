views:
  - name: entrustbill_items_view
    description: >
      Material line items for entrustment bills. Contains commodity details
      including HS codes, quantities, tariffs, VAT, sale amounts, and
      warehouse movement data.

    cubes:
      - join_path: order_entrustbill_items
        includes:
          - pkid
          - entrust_code
          - cus_po
          - mat_code
          - mat_name
          - mat_mode
          - mat_unit
          - hscode
          - dl_brand
          - dl_origin
          - pd_code
          - pd_name
          - sale_currency
          - create_time
          - count
          - total_mat_qtt
          - total_mat_value
          - total_tariff_amount
          - total_vat_amount
          - total_service_charge
          - total_ic_tax_amount
          - total_sale_amount
          - total_declare_amount
          - total_gross_weight
          - total_suttle
          - total_into_wh_qtt
          - total_out_wh_qtt
          - distinct_mat_codes
          - distinct_hscodes

      - join_path: order_entrustbill_items.order_entrustbill
        prefix: true
        includes:
          - code
          - order_date
          - status_label
          - cus_name
          - sup_name
          - bus_type_name
          - bus_model_name
          - order_value_currency
