cubes:
  - name: t_competitor_data
    sql_table: ai_ask_poc.t_competitor_data
    public: false
    title: 竞对数据

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        title: 主键ID

      - name: company_code
        sql: "{CUBE}.company_code"
        type: string
        title: 公司编码

      - name: company_name
        sql: "{CUBE}.company_name"
        type: string
        title: 公司名称

      - name: report_year
        sql: "{CUBE}.report_year"
        type: string
        title: 报告年度

      - name: data_source
        sql: "{CUBE}.data_source"
        type: string
        title: 数据来源

      - name: raw_data
        sql: "{CUBE}.raw_data"
        type: string
        title: 原始数据

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: 创建时间

      - name: updated_at
        sql: "{CUBE}.updated_at"
        type: time
        title: 更新时间

    measures:
      - name: count
        type: count
        title: 记录数

      - name: total_revenue
        sql: "{CUBE}.total_revenue"
        type: sum
        title: 营业总收入合计

      - name: total_mgmt_expense
        sql: "{CUBE}.mgmt_expense"
        type: sum
        title: 管理费用合计

      - name: total_selling_expense
        sql: "{CUBE}.selling_expense"
        type: sum
        title: 销售费用合计

      - name: total_rd_expense
        sql: "{CUBE}.rd_expense"
        type: sum
        title: 研发费用合计

      - name: total_finance_expense
        sql: "{CUBE}.finance_expense"
        type: sum
        title: 财务费用合计

      - name: total_net_profit
        sql: "{CUBE}.net_profit"
        type: sum
        title: 净利润合计

      - name: total_assets
        sql: "{CUBE}.total_assets"
        type: sum
        title: 总资产合计

      - name: total_employee_count
        sql: "{CUBE}.employee_count"
        type: sum
        title: 员工总数
