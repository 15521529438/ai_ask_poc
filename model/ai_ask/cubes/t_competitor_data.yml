cubes:
  - name: t_competitor_data
    sql_table: ai_ask_poc.t_competitor_data
    public: false
    title: 竞对数据

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        title: 主键ID

      - name: company_name
        sql: "{CUBE}.company_name"
        type: string
        title: 公司名称

      - name: fiscal_year
        sql: "{CUBE}.fiscal_year"
        type: string
        title: 财年

      - name: posting_period
        sql: "{CUBE}.posting_period"
        type: string
        title: 过账期间

      - name: data_source
        sql: "{CUBE}.data_source"
        type: string
        title: 数据来源

      - name: industry
        sql: "{CUBE}.industry"
        type: string
        title: 行业

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: 创建时间

      - name: updated_at
        sql: "{CUBE}.updated_at"
        type: time
        title: 更新时间

    measures:
      - name: count
        type: count
        title: 记录数

      - name: total_revenue
        sql: "{CUBE}.total_revenue"
        type: sum
        title: 总收入合计

      - name: total_cost
        sql: "{CUBE}.total_cost"
        type: sum
        title: 总成本合计

      - name: total_gross_profit
        sql: "{CUBE}.gross_profit"
        type: sum
        title: 毛利润合计

      - name: total_net_profit
        sql: "{CUBE}.net_profit"
        type: sum
        title: 净利润合计

      - name: total_assets
        sql: "{CUBE}.total_assets"
        type: sum
        title: 总资产合计

      - name: total_employee_count
        sql: "{CUBE}.employee_count"
        type: sum
        title: 员工总数
