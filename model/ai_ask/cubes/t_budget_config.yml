cubes:
  - name: t_budget_config
    sql_table: ai_ask_poc.t_budget_config
    public: false
    title: 预算配置表

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        title: 主键ID

      - name: company_code
        sql: "{CUBE}.company_code"
        type: string
        title: 公司代码

      - name: fiscal_year
        sql: "{CUBE}.fiscal_year"
        type: string
        title: 会计年度

      - name: posting_period
        sql: "{CUBE}.posting_period"
        type: string
        title: 期间（NULL表示全年）

      - name: expense_item
        sql: "{CUBE}.expense_item"
        type: string
        title: 费用项目

      - name: account_code
        sql: "{CUBE}.account_code"
        type: string
        title: 科目编码

      - name: data_source
        sql: "{CUBE}.data_source"
        type: string
        title: 数据来源（BUDGET_SYNC/MANUAL/IMPORT）

      - name: sync_time
        sql: "{CUBE}.sync_time"
        type: time
        title: 同步时间

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: 创建时间

      - name: updated_at
        sql: "{CUBE}.updated_at"
        type: time
        title: 更新时间

    measures:
      - name: count
        type: count
        title: 预算配置数量

      - name: total_budget_amount
        sql: "{CUBE}.budget_amount"
        type: sum
        title: 预算金额合计

      - name: total_actual_amount
        sql: "{CUBE}.actual_amount"
        type: sum
        title: 实际金额合计
