cubes:
  - name: t_threshold_config
    sql_table: ai_ask_poc.t_threshold_config
    public: false
    title: 风险阈值配置表

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        title: 主键ID

      - name: risk_type
        sql: "{CUBE}.risk_type"
        type: string
        title: 风险类型（ENTERTAIN_SPLIT/BIG_CONSULT/CANTEEN_HIGH/HIGH_FREQUENCY）

      - name: dimension
        sql: "{CUBE}.dimension"
        type: string
        title: 阈值维度（AMOUNT/DAYS/COUNT/PERCENT_TOP）

      - name: operator
        sql: "{CUBE}.operator"
        type: string
        title: 比较运算符（GTE/LTE/GT/LT/EQ）

      - name: threshold_value
        sql: "{CUBE}.threshold_value"
        type: number
        title: 阈值数值

      - name: unit
        sql: "{CUBE}.unit"
        type: string
        title: 阈值单位（YUAN/TIMES/DAY/PERCENT）

      - name: description
        sql: "{CUBE}.description"
        type: string
        title: 规则说明

      - name: is_active
        sql: "{CUBE}.is_active"
        type: string
        title: 是否启用

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: 创建时间

      - name: updated_at
        sql: "{CUBE}.updated_at"
        type: time
        title: 更新时间

    measures:
      - name: count
        type: count
        title: 阈值规则数量

      - name: active_count
        type: count
        filters:
          - sql: "{CUBE}.is_active = '1'"
        title: 启用规则数量
