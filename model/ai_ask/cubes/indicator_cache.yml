cubes:
  - name: indicator_cache
    sql_table: ai_ask_poc.indicator_cache
    public: false
    title: 指标计算缓存

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        title: 主键ID

      - name: company_code
        sql: "{CUBE}.company_code"
        type: string
        title: 公司编码

      - name: company_name
        sql: "{CUBE}.company_name"
        type: string
        title: 公司名称

      - name: data_year
        sql: "{CUBE}.data_year"
        type: string
        title: 年度

      - name: period_type
        sql: "{CUBE}.period_type"
        type: string
        title: 期间类型

      - name: business_item
        sql: "{CUBE}.business_item"
        type: string
        title: 业务维度

      - name: cost_category
        sql: "{CUBE}.cost_category"
        type: string
        title: 费用大类

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: 创建时间

      - name: updated_at
        sql: "{CUBE}.updated_at"
        type: time
        title: 更新时间

    measures:
      - name: count
        type: count
        title: 缓存记录数

      - name: total_net_amount
        sql: "{CUBE}.net_amount"
        type: sum
        title: 全口径费用合计

      - name: total_revenue
        sql: "{CUBE}.revenue"
        type: sum
        title: 营业收入合计

      - name: total_total_profit
        sql: "{CUBE}.total_profit"
        type: sum
        title: 利润总额合计

      - name: total_net_profit
        sql: "{CUBE}.net_profit"
        type: sum
        title: 净利润合计

      - name: total_selling_expense
        sql: "{CUBE}.selling_expense"
        type: sum
        title: 销售费用合计

      - name: total_admin_expense
        sql: "{CUBE}.admin_expense"
        type: sum
        title: 管理费用合计

      - name: total_rd_expense
        sql: "{CUBE}.rd_expense"
        type: sum
        title: 研发支出合计

      - name: total_finance_expense
        sql: "{CUBE}.finance_expense"
        type: sum
        title: 财务费用合计

      - name: total_employee_count
        sql: "{CUBE}.employee_count"
        type: sum
        title: 平均人数合计

      - name: total_budget_amount
        sql: "{CUBE}.budget_amount"
        type: sum
        title: 预算金额合计

      - name: total_contract_sales
        sql: "{CUBE}.contract_sales"
        type: sum
        title: 合同销售额合计

      - name: total_contract_cost
        sql: "{CUBE}.contract_cost"
        type: sum
        title: 合同履约成本合计
