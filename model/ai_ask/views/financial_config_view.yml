views:
  - name: financial_config_view
    description: >
      财务指标配置视图（基于指标配置表）。包含指标编码、名称、类别、公式模板、
      图表类型、单位、小数位、同比阈值、排序序号及启用状态等字段，
      供 BI 工具读取指标元数据，辅助动态报表生成。

    cubes:
      - join_path: t_indicator_config
        prefix: false
        includes:
          - id
          - indicator_code
          - indicator_name
          - category
          - formula_template
          - chart_type
          - unit
          - decimals
          - threshold_yoy
          - is_active
          - sort_order
          - analysis_dimension
          - execution_cycle
          - report_template
          - created_at
          - updated_at
          - count
          - active_count
