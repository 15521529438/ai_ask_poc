views:
  - name: balance_summary_view
    description: >
      科目余额【汇总】视图，已按 财年/期间、公司、科目、成本中心、利润中心 等维度【预聚合】。
      【计量口径】费用发生额 = Σ(期末余额 - 期初余额)；费用项(27项business_item)与
      四大类(管理/销售/研发/项目管理费 cost_category)均需经 SAP取数科目对照表(367末级科目)
      映射得到，expense_type 字段本身不等于费用项，分组统计须挂对照表。
      【首选场景】这是查询"费用项合计 / 费用总额 / 管理费用合计 / 某费用项金额 /
      某科目总额 / 本期发生额 / 本年累计(费用) / 期初期末余额 / 预算对比 / 账期纵向趋势"
      的【默认且首选】视图。凡是"费用项合计、XX费用合计、XX科目总额"等任何
      汇总/总额/合计口径的费用问题，一律走本视图，不要走 auxiliary_detail_view（辅助明细账）。
      【排他约束】营业收入、利润总额、净利润【不要】从本视图取——余额表为集团合并抵消前数据，
      收入/利润口径不准，这三项一律走利润报表视图(利润表 行1营收/行26利润总额/行28净利润)。
      （单笔凭证穿透、敏感词排查等明细级问题走辅助明细账；
      竞企/集团内子公司费用横向对比走利润报表视图。）

    cubes:
      - join_path: t_balance_summary
        prefix: false
        includes:
          - id
          - fiscal_year
          - posting_period
          - ledger_type
          - company_code
          - company_name
          - account_code
          - account_name
          - expense_type
          - cost_center
          - cost_center_name
          - profit_center
          - profit_center_name
          - wbs_element
          - wbs_desc
          - customer_code
          - customer_name
          - supplier_code
          - supplier_name
          - region_code
          - region_name
          - currency
          - unit
          - opening_direction
          - closing_direction
          - budget_source
          - created_at
          - count
          - total_opening_balance
          - total_current_debit
          - total_current_credit
          - total_current_net
          - total_ytd_debit
          - total_ytd_credit
          - total_ytd_net
          - total_closing_balance
          - total_budget_amount
          - distinct_accounts
