cubes:
  - name: order_entrustbill_goods
    sql: |
      SELECT pkid, id, pd_type, pd_name, mat_code, ct_pd_name, ct_pd_code,
             qtt, unit, unit_code, dl_price, amount,
             pl_into_wh_qtt, pl_out_wh_qtt, into_wh_qtt_sum, out_wh_qtt_sum,
             create_user, create_time, update_user, update_time, org_id
      FROM supply_chain_wy.order_entrustbill_t4
      UNION ALL
      SELECT pkid, id, pd_type, pd_name, mat_code, ct_pd_name, ct_pd_code,
             qtt, unit, unit_code, dl_price, amount,
             pl_into_wh_qtt, pl_out_wh_qtt, into_wh_qtt_sum, out_wh_qtt_sum,
             create_user, create_time, update_user, update_time, org_id
      FROM supply_chain_wy.order_entrustbill_t5
      UNION ALL
      SELECT pkid, id, pd_type, pd_name, mat_code, ct_pd_name, ct_pd_code,
             qtt, unit, unit_code, dl_price, amount,
             pl_into_wh_qtt, pl_out_wh_qtt, into_wh_qtt_sum, out_wh_qtt_sum,
             create_user, create_time, update_user, update_time, org_id
      FROM supply_chain_wy.order_entrustbill_t6
      UNION ALL
      SELECT pkid, id, pd_type, pd_name, mat_code, ct_pd_name, ct_pd_code,
             qtt, unit, unit_code, dl_price, amount,
             pl_into_wh_qtt, pl_out_wh_qtt, into_wh_qtt_sum, out_wh_qtt_sum,
             create_user, create_time, update_user, update_time, org_id
      FROM supply_chain_wy.order_entrustbill_t7
    public: false

    joins:
      - name: order_entrustbill
        sql: "{order_entrustbill}.id = {CUBE}.id"
        relationship: many_to_one

    dimensions:
      - name: pkid
        sql: "{CUBE}.pkid"
        type: number
        primary_key: true

      - name: id
        sql: "{CUBE}.id"
        type: number
        title: Order ID

      - name: pd_type
        sql: "{CUBE}.pd_type"
        type: string
        title: Product Type

      - name: pd_name
        sql: "{CUBE}.pd_name"
        type: string
        title: Product Name

      - name: mat_code
        sql: "{CUBE}.mat_code"
        type: string
        title: Material Code

      - name: ct_pd_name
        sql: "{CUBE}.ct_pd_name"
        type: string
        title: CT Product Name

      - name: ct_pd_code
        sql: "{CUBE}.ct_pd_code"
        type: string
        title: CT Product Code

      - name: unit
        sql: "{CUBE}.unit"
        type: string
        title: Unit

      - name: create_time
        sql: "{CUBE}.create_time"
        type: time
        title: Create Time

    measures:
      - name: count
        type: count
        title: Total Goods Items

      - name: total_qtt
        sql: "{CUBE}.qtt"
        type: sum
        title: Total Quantity

      - name: total_amount
        sql: "{CUBE}.amount"
        type: sum
        title: Total Amount

      - name: avg_dl_price
        sql: "{CUBE}.dl_price"
        type: avg
        title: Average Price

      - name: total_into_wh_qtt
        sql: "{CUBE}.into_wh_qtt_sum"
        type: sum
        title: Total Warehouse In Qty

      - name: total_out_wh_qtt
        sql: "{CUBE}.out_wh_qtt_sum"
        type: sum
        title: Total Warehouse Out Qty

      - name: distinct_product_types
        sql: "{CUBE}.pd_type"
        type: count_distinct
        title: Distinct Product Types
