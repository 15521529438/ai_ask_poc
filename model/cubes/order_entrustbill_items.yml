cubes:
  - name: order_entrustbill_items
    sql: |
      SELECT pkid, id, cus_po, mat_mode, mat_code, mat_name, mat_qtt, mat_wh_price,
             mat_value, hscode, tariff_rate, tariff_amount, vat_rate, vat_amount,
             service_charge, ic_tax_price, ic_tax_amount, dl_brand, dl_origin,
             suttle, gross_weight, sale_price, sale_amount, sale_currency_code,
             sale_currency, middle_price, middle_value, commission, otr,
             create_user, create_time, update_user, update_time, org_id,
             entrust_code, mat_unit, mat_unit_code, mat_mode_code,
             cus_receiving_num, dl_qtt, dl_price, declare_amount,
             apply_qtt, pl_into_wh_qtt, pl_out_wh_qtt,
             into_wh_qtt_sum, out_wh_qtt_sum, pd_code, pd_name,
             gross_weight, suttle, seq
      FROM supply_chain_wy.order_entrustbill_t1
      UNION ALL
      SELECT pkid, id, cus_po, mat_mode, mat_code, mat_name, mat_qtt, mat_wh_price,
             mat_value, hscode, tariff_rate, tariff_amount, vat_rate, vat_amount,
             service_charge, ic_tax_price, ic_tax_amount, dl_brand, dl_origin,
             suttle, gross_weight, sale_price, sale_amount, sale_currency_code,
             sale_currency, middle_price, middle_value, commission, otr,
             create_user, create_time, update_user, update_time, org_id,
             entrust_code, mat_unit, mat_unit_code, mat_mode_code,
             cus_receiving_num, dl_qtt, dl_price, declare_amount,
             apply_qtt, pl_into_wh_qtt, pl_out_wh_qtt,
             into_wh_qtt_sum, out_wh_qtt_sum, pd_code, pd_name,
             gross_weight, suttle, seq
      FROM supply_chain_wy.order_entrustbill_t2
      UNION ALL
      SELECT pkid, id, cus_po, mat_mode, mat_code, mat_name, mat_qtt, mat_wh_price,
             mat_value, hscode, tariff_rate, tariff_amount, vat_rate, vat_amount,
             service_charge, ic_tax_price, ic_tax_amount, dl_brand, dl_origin,
             suttle, gross_weight, sale_price, sale_amount, sale_currency_code,
             sale_currency, middle_price, middle_value, commission, otr,
             create_user, create_time, update_user, update_time, org_id,
             entrust_code, mat_unit, mat_unit_code, mat_mode_code,
             cus_receiving_num, dl_qtt, dl_price, declare_amount,
             apply_qtt, pl_into_wh_qtt, pl_out_wh_qtt,
             into_wh_qtt_sum, out_wh_qtt_sum, pd_code, pd_name,
             gross_weight, suttle, seq
      FROM supply_chain_wy.order_entrustbill_t3
    public: false

    joins:
      - name: order_entrustbill
        sql: "{order_entrustbill}.id = {CUBE}.id"
        relationship: many_to_one

    dimensions:
      - name: pkid
        sql: "{CUBE}.pkid"
        type: number
        primary_key: true

      - name: id
        sql: "{CUBE}.id"
        type: number
        title: Order ID

      - name: entrust_code
        sql: "{CUBE}.entrust_code"
        type: string
        title: Entrust Code

      - name: cus_po
        sql: "{CUBE}.cus_po"
        type: string
        title: Customer PO

      - name: mat_code
        sql: "{CUBE}.mat_code"
        type: string
        title: Material Code

      - name: mat_name
        sql: "{CUBE}.mat_name"
        type: string
        title: Material Name

      - name: mat_mode
        sql: "{CUBE}.mat_mode"
        type: string
        title: Material Mode

      - name: mat_unit
        sql: "{CUBE}.mat_unit"
        type: string
        title: Material Unit

      - name: hscode
        sql: "{CUBE}.hscode"
        type: string
        title: HS Code

      - name: dl_brand
        sql: "{CUBE}.dl_brand"
        type: string
        title: Brand

      - name: dl_origin
        sql: "{CUBE}.dl_origin"
        type: string
        title: Origin Country

      - name: pd_code
        sql: "{CUBE}.pd_code"
        type: string
        title: Product Code

      - name: pd_name
        sql: "{CUBE}.pd_name"
        type: string
        title: Product Name

      - name: sale_currency
        sql: "{CUBE}.sale_currency"
        type: string
        title: Sale Currency

      - name: create_time
        sql: "{CUBE}.create_time"
        type: time
        title: Create Time

    measures:
      - name: count
        type: count
        title: Total Line Items

      - name: total_mat_qtt
        sql: "{CUBE}.mat_qtt"
        type: sum
        title: Total Material Quantity

      - name: total_mat_value
        sql: "{CUBE}.mat_value"
        type: sum
        title: Total Material Value

      - name: total_tariff_amount
        sql: "{CUBE}.tariff_amount"
        type: sum
        title: Total Tariff Amount

      - name: total_vat_amount
        sql: "{CUBE}.vat_amount"
        type: sum
        title: Total VAT Amount

      - name: total_service_charge
        sql: "{CUBE}.service_charge"
        type: sum
        title: Total Service Charge

      - name: total_ic_tax_amount
        sql: "{CUBE}.ic_tax_amount"
        type: sum
        title: Total IC Tax Amount

      - name: total_sale_amount
        sql: "{CUBE}.sale_amount"
        type: sum
        title: Total Sale Amount

      - name: total_declare_amount
        sql: "{CUBE}.declare_amount"
        type: sum
        title: Total Declare Amount

      - name: total_gross_weight
        sql: "{CUBE}.gross_weight"
        type: sum
        title: Total Gross Weight

      - name: total_suttle
        sql: "{CUBE}.suttle"
        type: sum
        title: Total Net Weight

      - name: total_into_wh_qtt
        sql: "{CUBE}.into_wh_qtt_sum"
        type: sum
        title: Total Warehouse In Quantity

      - name: total_out_wh_qtt
        sql: "{CUBE}.out_wh_qtt_sum"
        type: sum
        title: Total Warehouse Out Quantity

      - name: distinct_mat_codes
        sql: "{CUBE}.mat_code"
        type: count_distinct
        title: Distinct Material Codes

      - name: distinct_hscodes
        sql: "{CUBE}.hscode"
        type: count_distinct
        title: Distinct HS Codes
